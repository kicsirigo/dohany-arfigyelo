name: SZTFH Árlista Frissítése

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitórium letöltése
        uses: actions/checkout@v4

      - name: Python 3.12 beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Függőségek telepítése
        run: pip install -r requirements.txt

      - name: SZTFH árak letöltése és feldolgozása
        run: python scripts/update_prices.py

      - name: Változások commitolása és pusholása
        run: |
          if [ -n "$(git status --porcelain data/prices.json data/price_history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/prices.json data/price_history.json
            git commit -m "chore: update official SZTFH prices ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Nincs változás az árlistában."
          fi

[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    tier1: Tier 1 isolated happy-path feature tests
    tier2: Tier 2 boundary, edge-case, and error-handling tests
    tier3: Tier 3 pairwise cross-feature combination tests
    tier4: Tier 4 real-world end-to-end user and pipeline scenarios
    tier5: Tier 5 adversarial regression tests
    selftest: Harness self-verification tests
